name: Upstream Sync

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect upstream without changing branches or pull requests
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'gage006/espcontrol' &&
      (github.ref == 'refs/heads/main' || inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Sync, request review, and merge eligible upstream updates
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
          SYNC_TOKEN_CONFIGURED: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 scripts/upstream_sync.py
