name: Upstream Sync

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect upstream without changing branches or pull requests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  dry-run:
    if: >-
      github.repository == 'gage006/espcontrol' &&
      github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Inspect upstream with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
        run: python3 scripts/upstream_sync.py

  sync:
    if: >-
      github.repository == 'gage006/espcontrol' &&
      github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sync, request review, and merge eligible upstream updates
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
          SYNC_TOKEN_CONFIGURED: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          DRY_RUN: 'false'
        run: python3 scripts/upstream_sync.py
