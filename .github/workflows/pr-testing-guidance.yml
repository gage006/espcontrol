name: PR Testing Guidance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-testing-guidance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guidance:
    name: Generate Testing Guidance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Generate bot comments from reviewed code and its trusted dependencies.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate \
            --jq '.[].filename | @json' > changed-files.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = []
          with Path("changed-files.jsonl").open(encoding="utf-8") as filenames:
              for line in filenames:
                  # Filenames are untrusted: keep each on one line inside Markdown
                  # code spans, and prevent mentions from becoming bot commands.
                  path = json.dumps(json.loads(line), ensure_ascii=True)[1:-1]
                  paths.append(path.replace("`", r"\u0060").replace("@", r"\u0040"))
          Path("changed-files.txt").write_text("\n".join(paths) + "\n")
          PY

      - name: Generate testing guidance
        run: |
          python3 scripts/pr_testing_guidance.py --changed-files changed-files.txt --output pr-testing-guidance.md
          python3 - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from device_profiles import load_device_profiles

          known = set(load_device_profiles())
          paths = Path("changed-files.txt").read_text().splitlines()
          devices = set()
          for path in paths:
              parts = path.split("/")
              if parts[0] == "devices" and len(parts) >= 3:
                  devices.add(parts[1])
              elif path.startswith("product/v2/devices/") and path.endswith(".json"):
                  devices.add(Path(path).stem)
              elif parts[0] == "builds" and len(parts) == 2 and path.endswith(".yaml"):
                  devices.add(Path(path).stem.removesuffix(".factory").removesuffix(".recovery"))
          added = sorted(devices - known)
          if added:
              note = ["", "## New or renamed devices", "",
                      "These devices are absent from the PR base and require device testing before merge:"]
              note.extend(f"- `{slug}`" for slug in added)
              with Path("pr-testing-guidance.md").open("a", encoding="utf-8") as output:
                  output.write("\n".join(note) + "\n")
          PY

      - name: Add guidance to workflow summary
        run: cat pr-testing-guidance.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: pr-testing-guidance
          path: pr-testing-guidance.md
          if-no-files-found: error

  comment:
    name: Post Testing Guidance
    needs: guidance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pr-testing-guidance

      - name: Add guidance to workflow summary
        run: cat pr-testing-guidance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          MARKER="<!-- espcontrol-pr-testing-guidance -->"
          COMMENT_ID="$(
            gh api \
              "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
              | tail -n 1
          )"

          if [ -n "${COMMENT_ID}" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -F body=@pr-testing-guidance.md
          else
            gh api \
              --method POST \
              "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -F body=@pr-testing-guidance.md
          fi

          STATUS=$?
          if [ "${STATUS}" -ne 0 ]; then
            echo "::warning::Could not post PR testing guidance as a comment. The guidance is still available in the workflow summary."
          fi
          exit 0
